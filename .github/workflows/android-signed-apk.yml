name: Android signed APK (cloud SDK)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a085c8-kaospad
    paths:
      - "android/**"
      - "web/**"
      - ".github/workflows/android-signed-apk.yml"

permissions:
  contents: read

jobs:
  assemble-release:
    name: assembleRelease on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform, NDK, CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.7 (no local wrapper JAR)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Sync PWA into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -a web/. android/app/src/main/assets/www/

      - name: Write local.properties
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "ndk.dir=${ANDROID_HOME}/ndk/26.1.10909125"
          } > android/local.properties

      - name: Prepare signing keystore
        env:
          KAOSS_KEYSTORE_BASE64: ${{ secrets.KAOSS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KS="${RUNNER_TEMP}/kaoss-release.jks"
          if [ -n "${KAOSS_KEYSTORE_BASE64:-}" ]; then
            echo "${KAOSS_KEYSTORE_BASE64}" | base64 -d > "${KS}"
          else
            keytool -genkeypair -keystore "${KS}" -alias kaoss \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass android -keypass android \
              -dname "CN=Kaoss Beatbox Studio, OU=Offline, O=Kaoss, L=Berlin, C=DE"
          fi
          echo "KAOSS_KEYSTORE_FILE=${KS}" >> "${GITHUB_ENV}"
          echo "KAOSS_KEYSTORE_PASSWORD=${KAOSS_KEYSTORE_PASSWORD:-android}" >> "${GITHUB_ENV}"
          echo "KAOSS_KEY_ALIAS=${KAOSS_KEY_ALIAS:-kaoss}" >> "${GITHUB_ENV}"
          echo "KAOSS_KEY_PASSWORD=${KAOSS_KEY_PASSWORD:-android}" >> "${GITHUB_ENV}"

      - name: Gradle assembleRelease
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Hash and list APK
        run: |
          find android/app/build/outputs/apk -name '*.apk' -print -exec sha256sum {} \;
          unzip -l android/app/build/outputs/apk/release/*.apk | head -60

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: KaossBeatboxStudio-v5.0.0-cloud-signed
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

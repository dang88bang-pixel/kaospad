name: Kaoss & Neural Cypher Multi-Platform Release Engine

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  dsp-audio-verification:
    name: DSP Latency & Brickwall Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Install Audio DSP Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - name: Compile Native C++ Audio Engines
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_UNIT_TESTS=ON
          cmake --build build
      - name: Run Latency & Limiter Verification Tests
        run: |
          ./build/audio_latency_e2e_test --max-latency=1.2ms
          ./build/brickwall_limiter_test --threshold=-3.2dBFS
          ./build/transient_splitter_test
          ./build/audio_input_processor_test
      - name: Bridge & Release-Guard Contract (no SDK needed)
        run: |
          python3 tests/native_audio_bridge_test.py
          python3 tests/release_artifact_guard_test.py

  build-android:
    needs: dsp-audio-verification
    name: Build Android APK/AAB (real Gradle + NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform, NDK, CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Sync PWA + WASM into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -a web/. android/app/src/main/assets/www/

      - name: Write local.properties
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "ndk.dir=${ANDROID_HOME}/ndk/26.1.10909125"
          } > android/local.properties

      - name: Prepare signing keystore
        env:
          KAOSS_KEYSTORE_BASE64: ${{ secrets.KAOSS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KS="${RUNNER_TEMP}/kaoss-release.jks"
          if [ -n "${KAOSS_KEYSTORE_BASE64:-}" ]; then
            echo "${KAOSS_KEYSTORE_BASE64}" | base64 -d > "${KS}"
          else
            keytool -genkeypair -keystore "${KS}" -alias kaoss \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass android -keypass android \
              -dname "CN=Kaoss Beatbox Studio, OU=Offline, O=Kaoss, L=Berlin, C=DE"
          fi
          echo "KAOSS_KEYSTORE_FILE=${KS}" >> "${GITHUB_ENV}"
          echo "KAOSS_KEYSTORE_PASSWORD=${KAOSS_KEYSTORE_PASSWORD:-android}" >> "${GITHUB_ENV}"
          echo "KAOSS_KEY_ALIAS=${KAOSS_KEY_ALIAS:-kaoss}" >> "${GITHUB_ENV}"
          echo "KAOSS_KEY_PASSWORD=${KAOSS_KEY_PASSWORD:-android}" >> "${GITHUB_ENV}"

      - name: Gradle assembleRelease + bundleRelease
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Guard: real ART APK/AAB with native DSP (no placeholders)
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile
          apks = sorted(glob.glob("android/app/build/outputs/apk/release/*.apk"))
          aabs = sorted(glob.glob("android/app/build/outputs/bundle/release/*.aab"))
          if not apks:
              sys.exit("no APK built")
          for artifact in apks + aabs:
              with zipfile.ZipFile(artifact) as z:
                  names = z.namelist()
              has_dex = any(n == "classes.dex" or n.endswith("/classes.dex") for n in names)
              has_so = any(n.startswith("lib/") and n.endswith("libkaoss_native.so") for n in names)
              if not (has_dex and has_so):
                  sys.exit(f"STUB rejected: {artifact} has_dex={has_dex} has_so={has_so}")
              print(f"real artifact: {artifact} (native DSP present)")
          PY

      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-production-build
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

  build-linux:
    needs: dsp-audio-verification
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust & Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libasound2-dev
      - name: Build Linux Desktop Executable
        run: |
          cd desktop
          cargo build --release
          cd ..
          ./scripts/build_appimage.sh
      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-appimage
          path: dist/*.AppImage

  build-macos:
    needs: dsp-audio-verification
    name: Build macOS DMG (Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust & Universal Targets
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
      - name: Compile macOS Binary & DMG Package
        run: |
          cd desktop
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cd ..
          ./scripts/create_universal_dmg.sh
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-dmg
          path: dist/*.dmg

  build-windows:
    needs: dsp-audio-verification
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Toolchains
        shell: pwsh
        run: choco install cmake ninja rust -y
      - name: Build Windows Installer (.msi)
        shell: pwsh
        run: |
          ./scripts/setup_asio_sdk.ps1
          cd desktop
          cargo build --release
          cd ..
          ./scripts/build_windows_installer.ps1
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: dist/*.msi

  build-web:
    needs: dsp-audio-verification
    name: Build Web PWA (+ WASM when available)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zip
      - run: ./scripts/package_web_pwa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web-pwa
          path: dist/KaossBeatboxStudio-WebAssembly-Offline.zip

  publish-release:
    needs: [build-android, build-linux, build-macos, build-windows, build-web]
    name: Publish verified production release to GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all compiled platform bundles
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten artifacts + SHA256SUMS + SBOM
        run: |
          mkdir -p release-assets
          find release-artifacts -type f -not -name 'SHA256SUMS' -not -name 'sbom.json' -exec cp -n {} release-assets/ \;
          (cd release-assets && sha256sum * > SHA256SUMS)
          python3 scripts/generate_sbom.py release-assets/sbom.json

      - name: Guard: verify real artifacts (fail on placeholders)
        run: python3 scripts/verify_release_artifacts.py release-assets

      - name: Create Official Multi-Platform GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Korg Kaoss & AI Beatbox Studio - Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

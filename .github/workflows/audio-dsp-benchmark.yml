name: Audio DSP Benchmark & Chain Verification

on:
  pull_request:
  push:
    branches: [main, arena/01a081b7-kaospad]
  workflow_dispatch:

jobs:
  benchmark:
    name: Native C++ DSP (Latency, Limiter, Transient)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_UNIT_TESTS=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: node tests/multi_avatar_sync_test.js

  wasm-parity:
    name: WASM DSP Core == Native == Python Mirror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install wasm32 toolchain (ziglang wheel, offline-fähig)
        run: python3 -m pip install --upgrade pip ziglang
      - name: Build kaoss_dsp.wasm from the C++ core
        run: ./scripts/build_wasm.sh
      - name: Build native parity harness
        run: |
          mkdir -p build
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Iandroid/app/src/main/cpp \
            tests/dsp_parity_harness.cpp \
            android/app/src/main/cpp/audio_flinger_hook.cpp \
            android/app/src/main/cpp/dsp_transient_splitter.cpp \
            android/app/src/main/cpp/kaoss_quad_engine.cpp \
            android/app/src/main/cpp/kaoss_dsp_abi.cpp \
            -o build/dsp_parity_native
      - name: Run 4-way DSP parity (wasm/native/python/browser-js)
        run: node tests/dsp_wasm_parity_test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: kaoss-dsp-wasm
          path: dist/wasm/

  action-chain:
    name: Offline Action & Interaction Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Phase 3: offizieller FlatBuffers-Compiler + Runtime, damit der
      # KPCM-PCM-Codec gegen die Referenz kreuzdecodiert wird (tests/flatbuffers_pcm_test.py).
      - name: FlatBuffers reference toolchain (flatc + runtime)
        run: python -m pip install --upgrade pip flatbuffers flatc
      - name: Zweite WASM-Laufzeit (wasmtime) fuer Cross-Runtime-Paritaet
        run: python -m pip install wasmtime
      - name: Web/UI contract + DOM-stub harness
        run: |
          make test-web-contract
          make test-action-chain-ui
          make test-web-ui-chain
      - name: One-App e2e + Kette + Zero-Cloud-Gate
        run: |
          make test-one-app
          make test-action-chain
          make test-zero-cloud
          make test-chain-attributes
          make test-client-hal
          make test-offline-daemons
          make test-resilience
          make test-watchdog
          make test-log-rotation
          make test-bug-report
          make test-flatbuffers-pcm
          make test-dsp-error-handling
          make test-failure-simulation
          make test-dex-builder
          make test-real-asr
          make test-wasm-cross-runtime
      - name: Live audio capture blocks (Mic/USB-UAC2/BLE-IPC)
        run: make test-live-capture
      - name: Session store persistence + .cypher replay
        run: make test-session-store
      - name: SSE /api/events/stream
        run: make test-sse

  ui-browser:
    name: Playwright Browser UI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the WASM DSP core (UI badge + parity in the browser)
        run: |
          python3 -m pip install ziglang
          ./scripts/build_wasm.sh
      - name: Run Playwright UI chain tests
        run: |
          set -o pipefail
          make test-ui 2>&1 | tee /tmp/kaoss-playwright.log
      # Job-Logs/Artefakte liegen auf Blob-Hosts, die nicht jeder Client
      # erreichen kann – deshalb schreibt der Job seine Fehler selbst in den PR.
      - name: Report Playwright failures to the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### Playwright UI (Chromium) – Fehlerdetails'
            echo
            echo '```text'
            grep -vE "^\s*(at |╔|║|╚)" /tmp/kaoss-playwright.log | tail -n 90
            echo '```'
          } > /tmp/kaoss-playwright-report.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "$GITHUB_REPOSITORY" --body-file /tmp/kaoss-playwright-report.md
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: test-results/

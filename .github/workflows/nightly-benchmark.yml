name: nightly-benchmark
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q -r requirements.txt || true
      - run: make test
      - run: ./scripts/run_nightly_benchmark.sh
      - uses: actions/upload-artifact@v4
        with: {name: nightly-benchmark, path: dist/benchmark.json}
